name: Release

# Push a tag such as v0.1.0 to make a release. The workflow builds, tests and publishes the x64 executables,
# signs them when signing is switched on, and creates a GitHub Release with the executables, SHA256SUMS.txt
# and the CHANGELOG.md section of the version as its notes. It also stores a build provenance attestation for
# the executables.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The tag must be v<Version>, with the Version from Directory.Build.props, and CHANGELOG.md must have a
      # section for that version. The section becomes the release notes.
      - name: Check the version and write the release notes
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The tag '$env:TAG' is not of the form v1.2.3." }
          $version = $Matches[1]
          $declared = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          if ($declared -ne $version) { throw "The tag is $env:TAG, but Directory.Build.props has Version $declared." }
          $notes = [Collections.Generic.List[string]]::new()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') { $inSection = $line -eq "## $version"; continue }
            if ($inSection) { $notes.Add($line) }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { throw "CHANGELOG.md has no section '## $version'." }
          $text += "`n`n### Files`n`n" +
            "- ``Plainstall-$version-win-x64.exe``: the app. It asks for administrator rights when it starts.`n" +
            "- ``Plainstall.Cli-$version-win-x64.exe``: the command-line tool.`n" +
            "- ``SHA256SUMS.txt``: the SHA-256 checksums of the two files.`n"
          New-Item -ItemType Directory -Force notes | Out-Null
          [IO.File]::WriteAllText("$PWD/notes/release-notes.md", $text, [Text.UTF8Encoding]::new($false))
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error

      - name: Build
        run: dotnet build Plainstall.slnx --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # project, name of the exe it produces, name stem of the release asset
          $targets = @(
            @{ Project = 'src/Plainstall.App/Plainstall.App.csproj'; Exe = 'Plainstall.App.exe'; Asset = 'Plainstall' },
            @{ Project = 'src/Plainstall.Cli/Plainstall.Cli.csproj'; Exe = 'Plainstall.Cli.exe'; Asset = 'Plainstall.Cli' }
          )
          foreach ($target in $targets) {
            $out = "publish/$($target.Asset)"
            dotnet publish $target.Project --configuration Release --runtime win-x64 --output $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item (Join-Path $out $target.Exe) "dist/$($target.Asset)-$env:VERSION-win-x64.exe"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload the unsigned executables
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/*.exe
          if-no-files-found: error

  # Code signing. Switched off until the project has a signing certificate:
  #   1. Apply to SignPath Foundation (free for open-source projects): https://signpath.org
  #   2. In the repository settings add
  #        variable SIGNING_ENABLED               = true
  #        variable SIGNPATH_ORGANIZATION_ID      = the organization id SignPath shows
  #        variable SIGNPATH_PROJECT_SLUG         = the project slug chosen in SignPath
  #        variable SIGNPATH_SIGNING_POLICY_SLUG  = for example release-signing
  #        secret   SIGNPATH_API_TOKEN            = an API token of a SignPath CI user
  #   3. Install the SignPath GitHub app on the repository, so SignPath can verify where the build came from.
  # Alternative: Azure Trusted Signing with azure/trusted-signing-action, if the owner qualifies for it.
  # Either way the signed files replace the unsigned ones before checksums and the attestation are made.
  sign:
    name: Sign
    needs: build
    if: vars.SIGNING_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Submit to SignPath and wait for the signed files
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check that every file came back signed
        shell: pwsh
        run: |
          $files = Get-ChildItem signed -Filter *.exe
          if (-not $files) { throw 'No signed files were returned.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
          }

      - name: Upload the signed executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: signed/*.exe
          if-no-files-found: error

  release:
    name: Create the release
    needs: [build, sign]
    # Runs when the build succeeded and signing either succeeded or was switched off. A failed signing stops the release.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store the provenance attestation
    steps:
      - name: Download the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'signed' || 'unsigned' }}
          path: dist

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          # LF line ends and no byte order mark, so 'sha256sum --check' accepts the file.
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Get-Content dist/SHA256SUMS.txt

      # GitHub makes attestations for private repositories only on GitHub Enterprise Cloud.
      # For a private repository this step is skipped, so the release is still made.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create $env:TAG @files --title "Plainstall $env:TAG" --notes-file notes/release-notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
